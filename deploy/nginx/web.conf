# 示例 Nginx 配置：托管 frontend/web 的静态构建产物（dist/），并把 /v1、
# /console 反代到 cmd/gateway，做到前后端同源——浏览器侧完全不需要 CORS
# （见 frontend/web/ARCHITECTURE.md §2、§9 和 internal/httpx.CORS 的包注释：
# CORS 是给"前后端确实分开部署、无法同源反代"的场景准备的可选项，同源反代
# 场景下不需要它）。
#
# 用法：把 gateway_upstream 的地址改成实际部署地址，dist/ 的路径改成真实
# 构建产物路径，直接放进 /etc/nginx/conf.d/ 或 sites-enabled/ 即可；具体的
# TLS 终止、HSTS、访问日志格式等按各自环境的标准配置补充，这里只给出和
# uFreeTokens 网关交互相关的部分。

upstream uft_gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name web.example.com; # 换成实际域名

    root /srv/uft-web/dist; # frontend/web 的 `npm run build` 产物
    index index.html;

    # 静态资源：SPA 路由，找不到文件就回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源可以长期缓存；index.html 本身不缓存，避免发新版本后用户还在
    # 用旧的 bundle 引用。
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /v1/*：OpenAI 兼容数据面，鉴权走 Authorization: Bearer <api-key>。
    # 流式响应（SSE）必须关掉 proxy_buffering，否则 Nginx 会攒够一个 buffer
    # 才转发，Playground 的打字机效果会变成一次性吐出一大段。
    location /v1/ {
        proxy_pass http://uft_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s; # 长回复/慢速上游的流式响应可能持续几分钟
        proxy_send_timeout 60s;
    }

    # /console/*：自助控制台，鉴权走 httpOnly Cookie Session。必须和 /v1
    # 走同一个 gateway 后端、同一个域名下的路径，Cookie 的 SameSite=Lax +
    # 不开 CORS 才有意义（见 internal/console 包文档）。
    location /console/ {
        proxy_pass http://uft_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}
