version: "3.9"

# 本地开发用依赖：PostgreSQL + Redis。
# 启动：docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uft
      POSTGRES_PASSWORD: uft
      POSTGRES_DB: uft
    ports:
      - "5432:5432"
    volumes:
      - uft_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uft -d uft"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uft_pg_data:
