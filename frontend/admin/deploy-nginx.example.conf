# frontend/admin 生产部署示例（内网 / VPN / SSO 之后，不能直接暴露公网，
# 见 ARCHITECTURE.md §3）。静态文件为 `npm run build` 产出的 dist/。
server {
    listen 80;
    server_name admin.ufreetokens.internal;

    root /srv/ufreetokens-admin/dist;
    index index.html;

    # 接口：/admin-api/xxx -> cmd/admin :8081 的 /xxx（去掉前缀，与 vite dev proxy 一致）
    location /admin-api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/accounts/123 等前端路由都返回 index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri $uri/ /index.html;
    }
}
