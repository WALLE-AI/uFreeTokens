# 网关进程配置示例。实际值可被同名环境变量覆盖（前缀 UFT_，层级用下划线分隔）。
# 参见技术方案 附录 B。
gateway:
  addr: ":8080"
  max_body_bytes: 20971520      # 20MB
  read_header_timeout: 5s
  read_timeout: 30s
  idle_timeout: 120s
  stream_idle_timeout: 120s
  shutdown_grace: 30s
  cors_origins: ""               # 逗号分隔；留空不启用（同源反代场景，见 frontend/web）

metrics:
  addr: ":9090"

retry:
  max_attempts: 3
  total_deadline: 90s
  budget_ratio: 0.2

billing:
  reserve_output_cap: 8192
  reservation_ttl: 30m
  rounding: ceil_micro

postgres:
  dsn: "postgres://uft:uft@localhost:5432/uft?sslmode=disable"
  max_conns: 20

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

secrets:
  kek_source: env
  kek_env: UFT_KEK
  api_key_pepper_env: UFT_KEY_PEPPER

log:
  level: debug
  format: console   # console(dev) / json(prod)

console:
  cookie_secure: false          # 本地 http 开发环境必须是 false；生产 HTTPS 环境应设为 true

# 免鉴权公开数据接口 GET /v1/rankings/*、/v1/benchmarks（docs/基准测试与排行榜数据服务技术方案.md）
public:
  rankings_enabled: true        # false 时 /v1/rankings/* 返回 503，前端显示"数据维护中"
  rankings_show_absolute: false # 是否公开绝对 token 数；默认只公开份额与排名
  rankings_min_accounts: 3      # 统计期内独立账户数低于该值的模型/作者/应用不单独上榜

# 后台辅助任务共用的 LLM（OpenAI 兼容，可直接指向本平台网关）：worker 的优惠文案抽取、
# cmd/admin 的展示元数据「AI 生成介绍」都读这里。留空 = 不启用这两项功能。
# 也可用环境变量 UFT_DATASYNC_LLM_BASE_URL / UFT_DATASYNC_LLM_MODEL 覆盖。
datasync:
  llm_base_url: ""                          # 例：http://127.0.0.1:8080/v1
  llm_model: ""                             # 例：deepseek/deepseek-chat
  llm_api_key_env: UFT_DATASYNC_LLM_API_KEY # 密钥只放环境变量，这里写变量名

# 运营后台智能体（Harness）。llm_* 留空时回落到 datasync.llm_*；需要具备 tool calling 能力的模型。
agent:
  enabled: false                # 总开关；false 时 /agent/* 返回 503，前端隐藏全部智能体入口
  jobs_enabled: false           # cmd/worker 是否运行后台智能作业
  llm_base_url: ""              # 例：http://127.0.0.1:8080/v1
  llm_model: ""                 # 例：claude-sonnet-5
  llm_api_key_env: ""           # 例：UFT_AGENT_LLM_API_KEY
  batch_model: ""               # 后台作业用的更便宜的模型；空 = 同 llm_model
  max_turns: 20                 # 单次运行最大轮数
  max_tool_calls: 40            # 单次运行最大工具调用数
  max_tokens: 200000            # 单次运行 Token 上限（输入+输出）
  run_timeout: 10m              # 单次运行时长上限
  fetch_allow_domains: ""       # fetch_page 额外允许的域名，逗号分隔
  monthly_token_cap: 0          # 后台作业月度 Token 上限；0 = 不限

# 数据面转发开关（Gateway 多模态接口补全与缺陷修复技术实施方案）
relay:
  enforce_vision: false         # true 时带图片的对话请求只路由到具备 vision 能力的渠道
  image_token_estimate: 1500    # 对话请求里每张图片按多少输入 token 预估（路由、TPM、预扣）
  disabled_endpoints: ""        # 逗号分隔，临时下线的端点：rerank / images / audio（返回 503 not_implemented）
  disabled_codecs: ""           # 逗号分隔，临时停用的 codec（如 dashscope.tts）：用到它的渠道不参与路由
