[pytest]
addopts = -ra
markers =
    direct: L0 direct upstream baseline (provider chosen by UFT_PROVIDER)
    gateway: L1 through local cmd/gateway
    stream: streaming cases
    paid: cases that cost upstream money
    not_implemented: gateway endpoints not implemented yet (assert current state + xfail target)
    known_defect: known gateway defects (xfail strict; turns XPASS once fixed)
